worker_processes auto;
error_log /var/log/openresty/error.log warn;
pid /var/run/openresty/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/openresty/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Lua package path
    lua_package_path "/etc/openresty/lua/?.lua;;";
    
    # Shared dict for channel cache
    lua_shared_dict channels_cache 10m;
    
    # Shared dict for stream tracking (in-memory, fast)
    # Format: key="user_{user_id}" value="{count},{last_activity}"
    lua_shared_dict active_streams 5m;
    
    # Shared dict for user limits cache
    # Format: key="user_{user_id}" value="{max_streams}"
    lua_shared_dict user_limits 1m;

    # Resolver for dynamic proxy
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Initialize bandwidth flush timer
    init_worker_by_lua_block {
        local bw_tracker = require("bandwidth_tracker")
        bw_tracker.init_timer()
    }

    server {
        listen 80;
        server_name _;

        # Variables for dynamic proxy
        set $stream_url "";
        set $stream_host "";

        # Proxy to Next.js for UI (replaces static HTML)
        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # Auth API - proxy to Python auth server
        location /auth/ {
            proxy_pass http://127.0.0.1:8081/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 60s;
        }
        
        # Internal auth check for stream validation (not accessible externally)
        location = /_internal_auth {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/validate-stream;
            proxy_set_header Content-Type "application/json";
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body on;
        }
        
        # Internal session check (only validates session, not stream count)
        location = /_internal_session_check {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/validate-session;
            proxy_set_header Cookie $http_cookie;
        }
        
        # Internal bandwidth update (called by Lua timer)
        location = /_internal_bandwidth_update {
            internal;
            proxy_pass http://127.0.0.1:8081/auth/bandwidth/update;
            proxy_set_header X-Bytes-Sent $arg_bytes;
        }

        # API: Get all channels
        location /api/channels {
            default_type application/json;
            content_by_lua_file /etc/openresty/lua/channels.lua;
        }

        # API: Refresh channels (trigger reload)
        location /api/refresh {
            default_type application/json;
            content_by_lua_block {
                local channels = require("channels")
                channels.refresh()
                ngx.say('{"status": "refreshed"}')
            }
        }

        # Internal: Get last 50 log lines (for dashboard)
        location /_internal/logs {
            # Removed 'internal;' so Next.js can access
            default_type application/json;
            content_by_lua_block {
                -- Get both access and error logs
                local handle = io.popen("(tail -30 /var/log/openresty/access.log 2>/dev/null; tail -20 /var/log/openresty/error.log 2>/dev/null) | tail -50 || echo 'No logs available'")
                local result = handle:read("*a")
                handle:close()
                
                -- Split into lines and format as JSON array
                local lines = {}
                for line in result:gmatch("[^\r\n]+") do
                    -- Escape quotes and backslashes for JSON
                    line = line:gsub('\\', '\\\\')
                    line = line:gsub('"', '\\"')
                    table.insert(lines, '"' .. line .. '"')
                end
                
                ngx.say('{"logs":[' .. table.concat(lines, ",") .. ']}')
            }
        }

        # Stream proxy - resolves channel ID and proxies the stream
        location ~ ^/stream/([^/]+)/?(\d*)$ {
            set $channel_id $1;
            set $server_idx $2;
            
            # CORS headers for browser access
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Type' always;
            # AUTH REMOVED - Public streaming
            # PROTECTION: Referer Check & User-Agent Lock
            access_by_lua_block {
                -- 1. Referer Protection (STRICT)
                local referer = ngx.var.http_referer or ""
                local allowed_host = "iptv.wakkar.net"
                if referer == "" or not string.find(referer, allowed_host, 1, true) then
                    ngx.status = 403
                    ngx.say("Forbidden: Invalid Referer")
                    return ngx.exit(403)
                end
                
                -- 2. User-Agent Protection
                local ua = ngx.var.http_user_agent or ""
                if ua == "" or string.find(ua, "curl") or string.find(ua, "wget") or string.find(ua, "python") or string.find(ua, "VLC") then
                    ngx.status = 403
                    ngx.say("Forbidden: Invalid User-Agent")
                    return ngx.exit(403)
                end

                -- 3. Signed Token Protection (Option 1)
                local args = ngx.req.get_uri_args()
                local token = args.token
                
                if not token then
                    ngx.status = 403
                    ngx.say("Forbidden: Missing Token")
                    return ngx.exit(403)
                end
                
                local expires_str, signature = token:match("^(%d+)-(.+)$")
                if not expires_str or not signature then
                    ngx.status = 403
                    ngx.say("Forbidden: Invalid Token Format")
                    return ngx.exit(403)
                end
                
                local expires = tonumber(expires_str)
                if expires < ngx.time() then
                    ngx.status = 403
                    ngx.say("Forbidden: Token Expired")
                    return ngx.exit(403)
                end
                
                -- Validate Signature: MD5(cloudflare:channel:expires:secret)
                local secret = "str34m_t0k3n_s3cr3t_k3y_2026"
                local channel_id = ngx.var.channel_id
                
                -- Reconstruct data (using cloudflare instead of IP for Cloudflare proxy compatibility)
                local data = "cloudflare:" .. channel_id .. ":" .. expires_str .. ":" .. secret
                local calculated_sig = ngx.md5(data)
                
                if signature ~= calculated_sig then
                    ngx.log(ngx.ERR, "Token Mismatch: Got " .. signature .. " Calc " .. calculated_sig .. " Data " .. data)
                    ngx.status = 403
                    ngx.say("Forbidden: Invalid Signature")
                    return ngx.exit(403)
                end
            }
            
            # Simple bandwidth tracking
            # No login required
            
            # Simple bandwidth tracking (no user tracking)
            log_by_lua_block {
                local bw_tracker = require("bandwidth_tracker")
                local bytes_sent = tonumber(ngx.var.body_bytes_sent) or 0
                if bytes_sent > 0 then
                    bw_tracker.add_bytes(bytes_sent)
                end
            }
            
            # Resolve stream URL and proxy directly
            rewrite_by_lua_block {
                local channels = require("channels")
                local channel_id = ngx.var.channel_id
                local server_idx = tonumber(ngx.var.server_idx) or 0
                
                local stream_url = channels.get_stream_url(channel_id, server_idx)
                
                if not stream_url then
                    ngx.status = 404
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"error": "Channel not found"}')
                    return ngx.exit(404)
                end
                
                -- Parse URL for proxy
                local match = ngx.re.match(stream_url, "^(https?)://([^/:]+)(:\\d+)?(.*)$")
                if match then
                    local scheme = match[1]
                    local host = match[2]
                    local port = match[3] or ""
                    local path = match[4] or "/"
                    
                    ngx.var.stream_url = stream_url
                    ngx.var.stream_host = host
                    
                    ngx.log(ngx.INFO, "Proxying to: " .. stream_url)
                else
                    ngx.status = 500
                    ngx.say('{"error": "Invalid stream URL"}')
                    return ngx.exit(500)
                end
            }
            
            # Disable buffering for live streaming
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Proxy pass to the stream
            proxy_pass $stream_url;
            
            # Headers for upstream
            proxy_set_header Host $stream_host;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_set_header Accept "*/*";
            proxy_set_header Referer "";
            
            # Follow redirects internally (key fix!)
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Allow proxy to follow redirects
            proxy_redirect off;
        }
        
        # Handle redirects from upstream
        location @handle_redirect {
            # Get the redirect location
            set $redirect_uri $upstream_http_location;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            
            # Disable buffering
            proxy_buffering off;
            
            # Follow the redirect
            proxy_pass $redirect_uri;
            
            # Headers
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_set_header Accept "*/*";
        }

        # Watch page - NOW HANDLED BY NEXT.JS via location /
        # Health check
        location /health {
            default_type text/plain;
            return 200 "OK";
        }
    }
}
