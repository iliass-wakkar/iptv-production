<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IPTV Web Player</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--accent);
            margin: 0;
        }

        .login-header p {
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--bg-secondary);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .turnstile-wrapper {
            margin: 15px 0;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .submit-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            display: block;
        }

        .status-bar {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-bar .count {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-secondary);
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--bg-secondary);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }
    </style>
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎬 IPTV Player</h1>
            <p>Access thousands of live channels</p>
        </div>

        <div id="status-bar" class="status-bar">
            <span class="count" id="available-slots">--</span> slots available
        </div>

        <div id="message" class="message"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('register')">📧 Get Access</button>
            <button class="tab-btn" onclick="showTab('login')">🔑 VIP Login</button>
        </div>

        <!-- Register Tab -->
        <div id="register-tab" class="tab-content active">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="your@email.com" required>
                </div>

                <!-- Cloudflare Turnstile Widget -->
                <div class="turnstile-wrapper">
                    <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onTurnstileSuccess"
                        data-theme="dark">
                    </div>
                </div>
                <input type="hidden" id="cf-token" name="cf-turnstile-response">

                <button type="submit" class="submit-btn" id="register-btn">
                    📨 Send Login Link
                </button>
            </form>

            <p style="text-align: center; color: var(--text-secondary); margin-top: 20px; font-size: 0.9rem;">
                We'll send you a one-time login link valid for 24 hours.
            </p>
        </div>

        <!-- VIP Login Tab -->
        <div id="login-tab" class="tab-content">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="admin or vip01" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-btn">
                    🔓 Login
                </button>
            </form>

            <p style="text-align: center; color: var(--text-secondary); margin-top: 20px; font-size: 0.9rem;">
                For Admin and VIP members only.
            </p>
        </div>
    </div>

    <script>
        let turnstileToken = null;

        // Turnstile success callback
        function onTurnstileSuccess(token) {
            turnstileToken = token;
            document.getElementById('cf-token').value = token;
            document.getElementById('register-btn').disabled = false;
        }

        // Load status
        async function loadStatus() {
            try {
                const res = await fetch('/auth/status');
                const data = await res.json();
                document.getElementById('available-slots').textContent = data.available_slots;

                if (data.queue_enabled) {
                    document.getElementById('status-bar').innerHTML =
                        '<span style="color: #f59e0b;">⏳ Server full - Join queue</span>';
                }
            } catch (e) {
                document.getElementById('available-slots').textContent = '--';
            }
        }

        // Tab switching
        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="showTab('${tab}')"]`).classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
        }

        // Handle registration
        async function handleRegister(e) {
            e.preventDefault();

            const email = document.getElementById('reg-email').value;
            const cfToken = document.getElementById('cf-token').value;
            const btn = document.getElementById('register-btn');

            if (!cfToken) {
                showMessage('❌ Please complete the verification', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        cf_token: cfToken
                    })
                });

                const data = await res.json();

                if (data.success) {
                    if (data.queued) {
                        showMessage(`📋 Added to queue at position ${data.position}. We'll email you when a spot opens!`, 'success');
                    } else {
                        showMessage('✅ Check your email for the login link!', 'success');
                    }
                    document.getElementById('register-form').reset();
                    // Reset Turnstile widget
                    if (typeof turnstile !== 'undefined') {
                        turnstile.reset();
                    }
                    turnstileToken = null;
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                    // Reset Turnstile on error
                    if (typeof turnstile !== 'undefined') {
                        turnstile.reset();
                    }
                }
            } catch (e) {
                showMessage('❌ Connection error. Please try again.', 'error');
            }

            btn.disabled = false;
            btn.textContent = '📨 Send Login Link';
        }

        // Handle VIP login
        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Set session cookie and redirect
                    document.cookie = `session=${data.token}; path=/; max-age=86400`;
                    window.location.href = '/';
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (e) {
                showMessage('❌ Connection error. Please try again.', 'error');
            }
        }

        // Initialize - disable button until Turnstile solved
        document.getElementById('register-btn').disabled = true;
        loadStatus();
    </script>
</body>

</html>
