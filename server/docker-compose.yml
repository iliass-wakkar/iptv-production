version: '3.8'

services:
  # Next.js Frontend (runs on port 3000 inside container)
  nextjs:
    build:
      context: ../app
      dockerfile: Dockerfile.nextjs
    container_name: iptv-nextjs
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  # Main IPTV server (NGINX + Lua + Python)
  iptv:
    build: .
    container_name: iptv-prod
    ports:
      - "8080:80"
    volumes:
      - ./data:/etc/openresty/data
      - ./backups:/backups
    env_file:
      - .env
    depends_on:
      - nextjs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
