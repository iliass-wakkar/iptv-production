name: Deploy IPTV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          # Use rsync for reliable sync (excludes are handled by .gitignore)
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            --exclude '*.zip' \
            --exclude '.env' \
            --exclude '.env.local' \
            ./app/ ubuntu@${{ secrets.SERVER_IP }}:~/iptv-app/app/
          
          rsync -avz --delete \
            --exclude '.env' \
            ./server/ ubuntu@${{ secrets.SERVER_IP }}:~/iptv-app/server/

          # Rebuild on server
          ssh ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
            cd ~/iptv-app/server
            chmod -R 755 ~/iptv-app/app ~/iptv-app/server
            docker compose down
            docker compose up --build -d
            echo "✅ Deployment complete!"
          EOF

      - name: Verify Deployment
        run: |
          sleep 15
          curl -sf http://${{ secrets.SERVER_IP }}:80 > /dev/null && echo "✅ Site is up!" || echo "⚠️ Health check failed"
