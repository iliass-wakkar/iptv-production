# NGINX Configuration for IPTV Platform
# OpenResty with Lua for stream proxying
# Proxies UI requests to Next.js

worker_processes auto;
error_log /var/log/openresty/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/openresty/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Resolver for dynamic proxy
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name localhost;

        # Variables for stream
        set $stream_url "";
        set $stream_host "";

        # ============================================
        # STREAM PROXY with CORS
        # ============================================
        location ~ ^/stream/([^/]+)/?(\\d*)$ {
            set $channel_id $1;
            set $server_idx $2;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Type' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            # Resolve channel URL
            rewrite_by_lua_block {
                local cjson = require("cjson.safe")
                local channel_id = ngx.var.channel_id
                local server_idx = tonumber(ngx.var.server_idx) or 0

                local file = io.open("/etc/openresty/data/channels.json", "r")
                if not file then
                    ngx.log(ngx.ERR, "Cannot open channels.json")
                    ngx.exit(500)
                    return
                end
                
                local content = file:read("*all")
                file:close()
                
                local channels = cjson.decode(content)
                if not channels or not channels[channel_id] then
                    ngx.status = 404
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"error": "Channel not found"}')
                    ngx.exit(404)
                    return
                end
                
                local ch = channels[channel_id]
                local servers = ch.servers or {}
                
                if #servers == 0 then
                    ngx.status = 404
                    ngx.say('{"error": "No stream"}')
                    ngx.exit(404)
                    return
                end
                
                local idx = math.min(server_idx + 1, #servers)
                local stream_url = servers[idx]
                
                local match = ngx.re.match(stream_url, "^(https?)://([^/:]+)(:\\d+)?(.*)$")
                if match then
                    ngx.var.stream_url = stream_url
                    ngx.var.stream_host = match[2]
                    ngx.log(ngx.INFO, "Stream: " .. channel_id .. " -> " .. stream_url)
                else
                    ngx.exit(500)
                end
            }

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_pass $stream_url;
            proxy_set_header Host $stream_host;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_set_header Accept "*/*";
            proxy_set_header Referer "";

            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @handle_redirect;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
        }

        location @handle_redirect {
            set $redirect_uri $upstream_http_location;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            proxy_buffering off;
            proxy_pass $redirect_uri;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        }

        # ============================================
        # NEXT.JS - Everything else
        # ============================================
        location / {
            proxy_pass http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            return 200 "OK";
        }
    }
}
